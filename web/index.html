<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Canvas Template</title>
    <style>
        #center-wrapper {
            display: flex;
            height: 100%;
            width: 100%;
            overflow: hidden;
            justify-content: center;

            /* Make canvas non-selectable */
            user-select: none;
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE10+/Edge */
            outline: none;  
        }
        p {
            margin-top: 0px;
            margin-bottom: 0px;
        }
    </style>
</head>
<body>
    <div id="center-wrapper">
        <div id="game-wrapper">
            <canvas id="game" width="360" height="720"></canvas>
            <p id="frame-rate"></p>
            <p id="message">Press any button to orbit!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
